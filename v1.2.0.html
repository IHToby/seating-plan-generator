            const bytes = new Uint8Array(binary.length);
            for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
            return bytes;
        }

        function showRememberedUpload(input, bytes, name) {
            const file = new File([bytes], name);
            const transfer = new DataTransfer();
            transfer.items.add(file);
            input.files = transfer.files;
        }

        function rememberState() {
            if (restoring) return;
            try {
                const rules = {};
                for (const id of RULE_IDS) rules[id] = document.getElementById(id).value;
                localStorage.setItem(REMEMBER_KEY, JSON.stringify({
                    rules,
                    classList: classListBytes ? bytesToBase64(classListBytes) : null,
                    classListName,
                    template: wordTemplate ? bytesToBase64(wordTemplate) : null,
                    templateKind,
                    templateName
                }));
            } catch { /* the page still works if the browser cannot store it */ }
        }

        function forgetState() {
            try { localStorage.removeItem(REMEMBER_KEY); } catch { /* already clear */ }
        }
        let seatTypeface = null;
        let lastSeats = null;

        function escapeHtml(value) {
            return String(value)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;');
        }

        function downloadBlob(bytes, name, type) {
            const blob = new Blob([bytes], { type });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = name;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
        }

        function getTopRowDeskOrder(numDesks) {
            if (numDesks <= 1) {
                return [...Array(numDesks).keys()];
            }
            if (numDesks === 2) {
                return [1, 0];
            }
            const leftCount = Math.floor(numDesks / 3);
            const rightCount = Math.floor(numDesks / 3);
            const middleCount = numDesks - leftCount - rightCount;
            const middle = [];
            for (let i = 0; i < middleCount; i++) {
                middle.push(leftCount + i);
            }
            const right = [];
            for (let i = 0; i < rightCount; i++) {
                right.push(leftCount + middleCount + i);
            }
            const left = [];
            for (let i = leftCount - 1; i >= 0; i--) {
                left.push(i);
            }
            return [...middle, ...right, ...left];
        }

        function getColumnPackRank(row, col, cols) {
            const order = getTopRowDeskOrder(Math.ceil(cols / 2));
            const desk = Math.floor(col / 2);
            const deskRank = order.indexOf(desk);
            return deskRank * 2 + (col % 2);
        }

        function pairPartnerCol(col, cols) {
            const partner = col % 2 === 0 ? col + 1 : col - 1;
            if (partner < 0 || partner >= cols) {
                return null;
            }
            return partner;
        }

        function isPartnerTaken(row, col, cols, availableSeats) {
            const partner = pairPartnerCol(col, cols);
            if (partner === null) {
                return false;
            }
            return !availableSeats.some(([r, c]) => r === row && c === partner);
        }

        function pairPlacementHeight(height1, height2, rows) {
            if ((height1 === 'tall' && height2 === 'short') || (height1 === 'short' && height2 === 'tall')) {
                return rows % 2 === 1 ? 'mixed' : 'short';
            }
            if (height1 === 'short' || height2 === 'short') {
                return 'short';
            }
            if (height1 === 'tall' || height2 === 'tall') {
                return 'tall';
            }
            return 'medium';
        }

        function comparePackedSeats(a, b, cols, frontRow, availableSeats) {
            const rowDiff = (frontRow - a[0]) - (frontRow - b[0]);
            if (rowDiff !== 0) {
                return rowDiff;
            }
            const pairA = isPartnerTaken(a[0], a[1], cols, availableSeats) ? 0 : 1;
            const pairB = isPartnerTaken(b[0], b[1], cols, availableSeats) ? 0 : 1;
            if (pairA !== pairB) {
                return pairA - pairB;
            }
            return getColumnPackRank(a[0], a[1], cols) - getColumnPackRank(b[0], b[1], cols);
        }

        function seatFaceCss(label) {
            if (!seatTypeface || !label) return '';
            const cjk = /[\u3400-\u9fff]/.test(label);
            const name = cjk ? seatTypeface.cjk : seatTypeface.latin;
            const pt = cjk ? seatTypeface.cjkPt : seatTypeface.latinPt;
            if (!name && !pt) return '';
            const family = name ? `font-family:'${String(name).replace(/'/g, '')}',sans-serif;` : '';
            const size = pt ? `font-size:${pt}pt;` : '';
            return family + size;
        }

        function seatFaceAttr(label) {
            const css = seatFaceCss(label);
            return css ? ` style="${css}"` : '';
        }

        function paintSeatFonts() {
            const table = document.querySelector('#container table');
            if (!table) return;
            table.classList.toggle('template-font', !!seatTypeface);
            for (const cell of table.querySelectorAll('td')) {
                cell.style.cssText = seatFaceCss(cell.textContent || '');
                fitLatinLabel(cell);
            }
        }

        function fitLatinLabel(cell) {
            const label = cell.textContent || '';
            if (!label || /[\u3400-\u9fff]/.test(label)) {
                if (cell.style.whiteSpace === 'nowrap') cell.style.whiteSpace = '';
                return;
            }
            cell.style.whiteSpace = 'nowrap';
            const probe = fitLatinLabel.context || (fitLatinLabel.context = document.createElement('canvas').getContext('2d'));
            const style = getComputedStyle(cell);
            const family = style.fontFamily;
            const weight = style.fontWeight;
            let size = parseFloat(style.fontSize);
            const available = cell.clientWidth - parseFloat(style.paddingLeft) - parseFloat(style.paddingRight);
            if (!Number.isFinite(size) || size <= 0 || available <= 8) return;
            while (size > 8) {
                probe.font = `${weight} ${size}px ${family}`;
                if (probe.measureText(label).width <= available) break;
                size -= 0.5;
            }
            cell.style.fontSize = `${size}px`;
        }

        let draggedSeat = null;

        function heightOfCell(cell) {
            return ['tall', 'medium', 'short'].find(name => cell.classList.contains(name)) || '';
        }

        function eventElement(target) {
            if (!target) return null;
            return target.nodeType === 1 ? target : target.parentElement;
        }

        function prepareSeatDragging() {
            const zone = document.getElementById('unseated-drop');
            zone.replaceChildren();
            zone.hidden = false;
            const table = document.querySelector('#container table');
            if (!table || !lastSeats) return;
            for (let r = 0; r < lastSeats.rows; r++) {
                for (let c = 0; c < lastSeats.cols; c++) {
                    table.rows[r].cells[c].draggable = lastSeats.seats[r][c] != null;
                }
            }
        }

        function clearSeatCell(cell) {
            cell.textContent = '';
            cell.classList.remove('tall', 'medium', 'short', 'is-dragging', 'seat-drop-target');
            cell.style.cssText = '';
            cell.draggable = false;
        }

        function writeSeatCell(cell, student) {
            cell.textContent = student.label;
            cell.classList.remove('tall', 'medium', 'short');
            if (student.height) cell.classList.add(student.height);
            cell.style.cssText = student.face || '';
            cell.draggable = true;
            fitLatinLabel(cell);
        }

        function studentFromCell(cell) {
            const row = cell.parentElement.rowIndex;
            const col = cell.cellIndex;
            const studentNo = lastSeats && lastSeats.seats[row] ? lastSeats.seats[row][col] : null;
            if (studentNo == null) return null;
            return {
                from: 'seat',
                row,
                col,
                cell,
                studentNo,
                label: cell.textContent,
                height: heightOfCell(cell),
                face: cell.style.cssText,
                weight: getComputedStyle(cell).fontWeight
            };
        }

        function studentFromChip(chip) {
            return {
                from: 'zone',
                chip,
                studentNo: parseInt(chip.dataset.student, 10),
                label: chip.textContent,
                height: chip.dataset.height || '',
                face: chip.dataset.faceStyle || '',
                weight: chip.style.fontWeight || getComputedStyle(chip).fontWeight
            };
        }

        function chipForStudent(student) {
            const chip = document.createElement('span');
            chip.className = 'seat-chip' + (student.height ? ' ' + student.height : '');
            chip.draggable = true;
            chip.dataset.student = String(student.studentNo);
            chip.dataset.height = student.height || '';
            chip.dataset.faceStyle = student.face || '';
            chip.textContent = student.label;
            chip.style.cssText = student.face || '';
            if (student.weight) chip.style.fontWeight = student.weight;
            return chip;
        }

        function seatIsEmpty(cell) {
            if (!lastSeats || !cell || !cell.closest('#container')) return false;
            const row = cell.parentElement.rowIndex;
            const col = cell.cellIndex;
            return lastSeats.seats[row][col] == null;
        }

        function markDropTarget(element) {
            document.querySelectorAll('.seat-drop-target').forEach(node => {
                if (node !== element) node.classList.remove('seat-drop-target');
            });
            if (element) element.classList.add('seat-drop-target');
        }

        function releaseDraggedSeat(student, nextCell) {
            if (!student || !Number.isInteger(student.studentNo)) return false;
            if (student.from === 'seat') {
                if (student.cell === nextCell) return false;
                clearSeatCell(student.cell);
                lastSeats.seats[student.row][student.col] = null;
            } else if (student.chip) {
                student.chip.remove();
            }
            return true;
        }

        function bindSeatDragging() {
            const zone = document.getElementById('unseated-drop');
            const container = document.getElementById('container');

            container.addEventListener('dragstart', (event) => {
                const origin = eventElement(event.target);
                const cell = origin && origin.closest('td');
                if (!cell || !container.contains(cell)) return;
                const student = studentFromCell(cell);
                if (!student) {
                    event.preventDefault();
                    return;
                }
                draggedSeat = student;
                cell.classList.add('is-dragging');
                event.dataTransfer.effectAllowed = 'move';
                event.dataTransfer.setData('text/plain', String(student.studentNo));
            });

            zone.addEventListener('dragstart', (event) => {
                const origin = eventElement(event.target);
                const chip = origin && origin.closest('.seat-chip');
                if (!chip) return;
                draggedSeat = studentFromChip(chip);
                chip.classList.add('is-dragging');
                event.dataTransfer.effectAllowed = 'move';
                event.dataTransfer.setData('text/plain', String(draggedSeat.studentNo));
            });

            document.addEventListener('dragend', () => {
                if (draggedSeat && draggedSeat.cell) draggedSeat.cell.classList.remove('is-dragging');
                if (draggedSeat && draggedSeat.chip) draggedSeat.chip.classList.remove('is-dragging');
                draggedSeat = null;
                markDropTarget(null);
            });

            function swapOntoSeat(student, cell) {
                const other = studentFromCell(cell);
                if (!other || other.studentNo === student.studentNo) return;
                if (student.from === 'seat') {
                    writeSeatCell(student.cell, other);
                    writeSeatCell(cell, student);
                    lastSeats.seats[student.row][student.col] = other.studentNo;
                    lastSeats.seats[other.row][other.col] = student.studentNo;
                } else {
                    if (student.chip) student.chip.remove();
                    writeSeatCell(cell, student);
                    lastSeats.seats[other.row][other.col] = student.studentNo;
                    zone.appendChild(chipForStudent(other));
                }
            }

            container.addEventListener('dragover', (event) => {
                if (!draggedSeat) return;
                const origin = eventElement(event.target);
                const cell = origin && origin.closest('td');
                if (!cell || !container.contains(cell) || cell === draggedSeat.cell) return;
                event.preventDefault();
                event.dataTransfer.dropEffect = 'move';
                markDropTarget(cell);
            });

            container.addEventListener('drop', (event) => {
                if (!draggedSeat) return;
                const origin = eventElement(event.target);
                const cell = origin && origin.closest('td');
                if (!cell || !container.contains(cell) || cell === draggedSeat.cell) return;
                event.preventDefault();
                const student = draggedSeat;
                if (seatIsEmpty(cell)) {
                    if (!releaseDraggedSeat(student, cell)) return;
                    writeSeatCell(cell, student);
                    lastSeats.seats[cell.parentElement.rowIndex][cell.cellIndex] = student.studentNo;
                } else {
                    swapOntoSeat(student, cell);
                }
                markDropTarget(null);
            });

            zone.addEventListener('dragover', (event) => {
                if (!draggedSeat || draggedSeat.from !== 'seat') return;
                event.preventDefault();
                event.dataTransfer.dropEffect = 'move';
                markDropTarget(zone);
            });

            zone.addEventListener('drop', (event) => {
                if (!draggedSeat || draggedSeat.from !== 'seat') return;
                event.preventDefault();
                const student = draggedSeat;
                if (!releaseDraggedSeat(student, null)) return;
                zone.appendChild(chipForStudent(student));
                markDropTarget(null);
            });
        }

        function generatePlan() {
            const rows = parseInt(document.getElementById('rows').value, 10);
            const cols = parseInt(document.getElementById('cols').value, 10);
            const totalStudents = parseInt(document.getElementById('students').value, 10);

            if (![rows, cols, totalStudents].every(n => Number.isInteger(n) && n >= 1)) {
                alert('Rows, columns, and total number of students must be whole numbers of at least 1.');
                return;
            }

            const mentionedNumbers = ['tall', 'short', 'naughty', 'restrictions', 'together'].flatMap(id =>
                document.getElementById(id).value.split(/[^0-9]+/)
                    .filter(part => part !== '')
                    .map(part => parseInt(part, 10))
                    .filter(num => Number.isInteger(num) && num >= 1)
            );
            if (mentionedNumbers.length > 0) {
                const largestNumber = Math.max(...mentionedNumbers);
                if (largestNumber > totalStudents) {
                    const proceed = confirm(`The largest student number (${largestNumber}) is greater than the total number of students (${totalStudents}). Numbers outside 1 to ${totalStudents} will be ignored. Continue?`);
                    if (!proceed) {
                        return;
                    }
                }
            }

            const parseClassNumbers = (id) => [...new Set(
                document.getElementById(id).value.split(',')
                    .map(s => parseInt(s.trim(), 10))
                    .filter(num => Number.isInteger(num) && num >= 1 && num <= totalStudents)
            )];
            const parsePairs = (id) => document.getElementById(id).value.split(',')
                .map(pair => pair.trim())
                .filter(pair => pair !== '')
                .map(pair => pair.split('-').map(s => parseInt(s.trim(), 10)))
                .filter(pair => pair.length === 2
                    && Number.isInteger(pair[0]) && Number.isInteger(pair[1])
                    && pair[0] >= 1 && pair[0] <= totalStudents
                    && pair[1] >= 1 && pair[1] <= totalStudents);

            const tallStudents = parseClassNumbers('tall');
            const shortStudents = parseClassNumbers('short');
            const naughtyStudents = parseClassNumbers('naughty');
            const mediumStudents = [];
            for (let n = 1; n <= totalStudents; n++) {
                if (!tallStudents.includes(n) && !shortStudents.includes(n)) {
                    mediumStudents.push(n);
                }
            }
            const restrictions = parsePairs('restrictions');
            const together = parsePairs('together');
            const frontRow = rows - 1;
            const middleRow = rows % 2 === 1 ? Math.floor(rows / 2) : null;
            const packTowardBlackboard = totalStudents < rows * cols;

            if (totalStudents > rows * cols) {
                alert('Total number of students exceed the classroom capacity.');
                return;
            }

            if (tallStudents.some(n => shortStudents.includes(n))) {
                alert('A student cannot be listed as both tall and short.');
                return;
            }

            if (naughtyStudents.length > Math.ceil(cols / 2)) {
                alert('Too many naughty students to seat them apart in the first row (nearest to the blackboard).');
                return;
            }

            const pairedStudents = new Set();
            for (const [a, b] of together) {
                if (a === b) {
                    alert('A student cannot be paired with themselves.');
                    return;
                }
                if (pairedStudents.has(a) || pairedStudents.has(b)) {
                    alert('A student cannot appear in more than one “Pair Up Students” pair.');
                    return;
                }
                if (naughtyStudents.includes(a) && naughtyStudents.includes(b)) {
                    alert('Naughty students must sit separately, so they cannot be paired up.');
                    return;
                }
                pairedStudents.add(a);
                pairedStudents.add(b);
            }

            for (const [together1, together2] of together) {
                if (restrictions.some(([restricted1, restricted2]) =>
                    (restricted1 === together1 && restricted2 === together2) ||
                    (restricted1 === together2 && restricted2 === together1))) {
                    alert('Input in “Separate Students” contradicts that in “Pair Up Students”.');
                    return;
                }
            }

            for (let i = 0; i < naughtyStudents.length; i++) {
                for (let j = i + 1; j < naughtyStudents.length; j++) {
                    restrictions.push([naughtyStudents[i], naughtyStudents[j]]);
                }
            }

            const plan = [];
            let availableSeats = [];
            for (let i = 0; i < rows; i++) {
                for (let j = 0; j < cols; j++) {
                    availableSeats.push([i, j]);
                }
            }

            const assignedSeats = {};
            const shuffleArray = (array) => {
                for (let i = array.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [array[i], array[j]] = [array[j], array[i]];
                }
                return array;
            };

            function seatAllowedForHeight(row, height, forceFrontRow, allowMiddle = false) {
                if (forceFrontRow) {
                    return row === frontRow;
                }
                if (height === 'mixed') {
                    return middleRow !== null && row === middleRow;
                }
                if (height === 'medium') {
                    return true;
                }
                if (middleRow !== null) {
                    if (height === 'tall') {
                        return row < middleRow || (allowMiddle && row === middleRow);
                    }
                    if (height === 'short') {
                        return row > middleRow || (allowMiddle && row === middleRow);
                    }
                }
                const frontHalfRows = Math.ceil(rows / 2);
                return (height === 'tall' && row < frontHalfRows) || (height === 'short' && row >= frontHalfRows);
            }

            function getOrderedCandidates(height, forceFrontRow, spreadApart = false, allowMiddle = false) {
                const candidates = availableSeats.filter(([row]) => seatAllowedForHeight(row, height, forceFrontRow, allowMiddle));
                if (spreadApart) {
                    return candidates.slice().sort((a, b) => {
                        const evenA = a[1] % 2;
                        const evenB = b[1] % 2;
                        if (evenA !== evenB) {
                            return evenA - evenB;
                        }
                        return a[1] - b[1];
                    });
                }
                if (height === 'short' || height === 'tall' || height === 'mixed') {
                    return shuffleArray(candidates.slice());
                }
                if (packTowardBlackboard) {
                    return candidates.slice().sort((a, b) => comparePackedSeats(a, b, cols, frontRow, availableSeats));
                }
                return shuffleArray(candidates.slice());
            }

            function takeCandidate(student, candidates) {
                for (const [row, col] of candidates) {
                    const seatIndex = availableSeats.findIndex(seat => seat[0] === row && seat[1] === col);
                    if (seatIndex === -1) {
                        continue;
                    }
                    if (isSeatValid(student, row, col, assignedSeats, restrictions)) {
                        assignedSeats[student] = [row, col];
                        availableSeats.splice(seatIndex, 1);
                        return true;
                    }
                }
                return false;
            }

            function assignStudent(student, height, forceFrontRow = false, spreadApart = false) {
                if (takeCandidate(student, getOrderedCandidates(height, forceFrontRow, spreadApart, false))) {
                    return true;
                }
                if (!forceFrontRow && middleRow !== null && (height === 'tall' || height === 'short')) {
                    return takeCandidate(student, getOrderedCandidates(height, false, spreadApart, true));
                }
                return false;
            }

            function assignPair(student1, student2, height1, height2, forceFrontRow = false) {
                const pairHeight = pairPlacementHeight(height1, height2, rows);
                const allowMiddleLater = !forceFrontRow && middleRow !== null && (pairHeight === 'tall' || pairHeight === 'short');
                const candidates = getOrderedCandidates(pairHeight, forceFrontRow, false, false);
                for (const [row, col] of candidates) {
                    const col2 = pairPartnerCol(col, cols);
                    if (col2 === null) {
                        continue;
                    }
                    if (isSeatValid(student1, row, col, assignedSeats, restrictions) &&
                        availableSeats.some(seat => seat[0] === row && seat[1] === col2) &&
                        isSeatValid(student2, row, col2, assignedSeats, restrictions)) {
                        assignedSeats[student1] = [row, col];
                        assignedSeats[student2] = [row, col2];
                        availableSeats = availableSeats.filter(seat => !(seat[0] === row && (seat[1] === col || seat[1] === col2)));
                        return true;
                    }
                }
                if (!allowMiddleLater) {
                    return false;
                }
                for (const [row, col] of getOrderedCandidates(pairHeight, false, false, true)) {
                    if (row !== middleRow) {
                        continue;
                    }
                    const col2 = pairPartnerCol(col, cols);
                    if (col2 === null) {
                        continue;
                    }
                    if (isSeatValid(student1, row, col, assignedSeats, restrictions) &&
                        availableSeats.some(seat => seat[0] === row && seat[1] === col2) &&
                        isSeatValid(student2, row, col2, assignedSeats, restrictions)) {
                        assignedSeats[student1] = [row, col];
                        assignedSeats[student2] = [row, col2];
                        availableSeats = availableSeats.filter(seat => !(seat[0] === row && (seat[1] === col || seat[1] === col2)));
                        return true;
                    }
                }
                return false;
            }

            const getHeight = (student) => tallStudents.includes(student) ? 'tall' : shortStudents.includes(student) ? 'short' : 'medium';
            const isNaughty = (student) => naughtyStudents.includes(student);
            const isMixedPair = (student1, student2) => {
                if (middleRow === null || isNaughty(student1) || isNaughty(student2)) {
                    return false;
                }
                const height1 = getHeight(student1);
                const height2 = getHeight(student2);
                return (height1 === 'tall' && height2 === 'short') || (height1 === 'short' && height2 === 'tall');
            };
            const isShortPair = (student1, student2) => !isNaughty(student1) && !isNaughty(student2) && !isMixedPair(student1, student2)
                && (getHeight(student1) === 'short' || getHeight(student2) === 'short');

            function placePair(student1, student2) {
                const height1 = getHeight(student1);
                const height2 = getHeight(student2);
                const forceFrontRow = isNaughty(student1) || isNaughty(student2);
                if (!assignPair(student1, student2, height1, height2, forceFrontRow)) {
                    alert(`Unable to place the pair ${student1} and ${student2} with the given restrictions.`);
                    return false;
                }
                return true;
            }

            function placePairs(predicate) {
                for (const [student1, student2] of together) {
                    if (predicate(student1, student2) && !placePair(student1, student2)) {
                        return false;
                    }
                }
                return true;
            }

            function placeIndividuals(students, height) {
                for (const student of shuffleArray(students.slice())) {
                    if (!assignedSeats[student] && !assignStudent(student, height)) {
                        return false;
                    }
                }
                return true;
            }

            if (!placePairs((student1, student2) => isNaughty(student1) || isNaughty(student2))) {
                return;
            }

            for (const student of shuffleArray(naughtyStudents.slice())) {
                if (!assignedSeats[student] && !assignStudent(student, getHeight(student), true, true)) {
                    alert('Unable to seat all naughty students in the first row (nearest to the blackboard).');
                    return;
                }
            }

            if (!placePairs(isShortPair)) {
                return;
            }
            if (!placePairs(isMixedPair)) {
                return;
            }
            if (!placeIndividuals(shortStudents, 'short')) {
                alert("Unable to place all students with the given restrictions. Try to press “Generate Seating Plan” again.");
                return;
            }

            if (!placePairs((student1, student2) => !isNaughty(student1) && !isNaughty(student2) && !isShortPair(student1, student2) && !isMixedPair(student1, student2))) {
                return;
            }

            let allAssigned = placeIndividuals(tallStudents, 'tall') && placeIndividuals(mediumStudents, 'medium');

            if (!allAssigned) {
                alert("Unable to place all students with the given restrictions. Try to press “Generate Seating Plan” again.");
                return;
            }

            if (packTowardBlackboard) {
                const placed = Object.keys(assignedSeats).map(id => {
                    const student = parseInt(id, 10);
                    const [row, col] = assignedSeats[student];
                    return { student, row, col };
                });
                if (placed.length > 0) {
                    const backRow = Math.min(...placed.map(p => p.row));
                    const inBack = placed.filter(p => p.row === backRow);
                    if (inBack.length < cols) {
                        const original = inBack.map(p => ({ student: p.student, row: p.row, col: p.col }));
                        for (const p of inBack) {
                            delete assignedSeats[p.student];
                            availableSeats.push([p.row, p.col]);
                        }
                        const deskOrder = getTopRowDeskOrder(Math.ceil(cols / 2));
                        const seatOrder = [];
                        for (const desk of deskOrder) {
                            const left = desk * 2;
                            const right = left + 1;
                            if (left < cols) {
                                seatOrder.push([backRow, left]);
                            }
                            if (right < cols) {
                                seatOrder.push([backRow, right]);
                            }
                        }
                        let compacted = true;
                        for (const student of inBack.map(p => p.student)) {
                            let seated = false;
                            for (const [row, col] of seatOrder) {
                                const seatIndex = availableSeats.findIndex(seat => seat[0] === row && seat[1] === col);
                                if (seatIndex === -1) {
                                    continue;
                                }
                                if (isSeatValid(student, row, col, assignedSeats, restrictions)) {
                                    assignedSeats[student] = [row, col];
                                    availableSeats.splice(seatIndex, 1);
                                    seated = true;
                                    break;
                                }
                            }
                            if (!seated) {
                                compacted = false;
                                break;
                            }
                        }
                        if (!compacted) {
                            for (const student of inBack.map(p => p.student)) {
                                if (assignedSeats[student]) {
                                    const [row, col] = assignedSeats[student];
                                    availableSeats.push([row, col]);
                                    delete assignedSeats[student];
                                }
                            }
                            for (const p of original) {
                                assignedSeats[p.student] = [p.row, p.col];
                                availableSeats = availableSeats.filter(seat => !(seat[0] === p.row && seat[1] === p.col));
                            }
                        }
                    }
                }
            }

            for (let i = 0; i < rows; i++) {
                const row = [];
                for (let j = 0; j < cols; j++) {
                    row.push('<td></td>');
                }
                plan.push(row);
            }

            for (const student in assignedSeats) {
                const [row, col] = assignedSeats[student];
                let heightClass = '';
                if (tallStudents.includes(parseInt(student))) {
                    heightClass = 'tall';
                } else if (mediumStudents.includes(parseInt(student))) {
                    heightClass = 'medium';
                } else {
                    heightClass = 'short';
                }
                const studentNo = parseInt(student, 10);
                const label = seatLabel(classList ? classList.get(studentNo) : null, studentNo);
                plan[row][col] = `<td class="${heightClass}"${seatFaceAttr(label)}>${escapeHtml(label)}</td>`;
            }

            const container = document.getElementById('container');
            container.innerHTML = '';
            const table = document.createElement('table');
            if (seatTypeface) table.classList.add('template-font');
            plan.forEach(row => {
                const tr = document.createElement('tr');
                row.forEach(cell => tr.innerHTML += cell);
                table.appendChild(tr);
            });
            container.appendChild(table);
            lastSeats = {
                rows,
                cols,
                seats: Array.from({ length: rows }, (_, row) => Array.from({ length: cols }, (_, col) => {
                    const found = Object.entries(assignedSeats).find(([, position]) => position[0] === row && position[1] === col);
                    return found ? parseInt(found[0], 10) : null;
                }))
            };

            document.getElementById('blackboard').style.display = 'block';
            document.getElementById('export-button').style.display = 'block'; // Show export button
            prepareSeatDragging();
            paintSeatFonts();
        }

        async function exportToWord() {
            if (!wordTemplate) {
                const container = document.getElementById('container');
                const tableHtml = container.innerHTML;
                const blackboardContent = document.getElementById('blackboard').innerHTML;
                const instructions = `<p>Instructions:<br>
                          1. To save any change: file -> save as -> set file format as .doc instead of .htm<br>
                          2. To change the document orientation from portrait to landscape: layout -> orientation -> landscape<br>
                          3. To insert a break between columns: right click -> insert -> columns to the left/right</p>`;
                const header = `<html xmlns:w="urn:schemas-microsoft-com:office:word">
                    <head>
                        <meta charset="utf-8">
                        <title>Seating Plan</title>
                        <style>
                            table { border-collapse: collapse; width: 100%; }
                            tr { min-height: 50px; }
                            td { border: 1px solid #d4e3e8; padding: 10px; text-align: center; }
                            .tall { background-color: #d9f2df; }
                            .medium { background-color: #f3f5c8; }
                            .short { background-color: #f6e4ea; }
                            .blackboard { color: white; background-color: #156872; padding: 10px; margin-top: 20px; border-radius: 5px; text-align: center; }
                            .blackboard-container { display: flex; justify-content: center; align-items: flex-end; margin-top: 20px; }
                        </style>
                    </head>
                    <body>
                        ${instructions}
                        ${tableHtml}
                        <div class="blackboard-container">
                            <div class="blackboard">${blackboardContent}</div>
                        </div>
                    </body>
                  </html>`;
                downloadBlob(new TextEncoder().encode(header), 'Seating Plan.doc', 'application/msword');
                return;
            }
            const rows = parseInt(document.getElementById('rows').value, 10);
            const cols = parseInt(document.getElementById('cols').value, 10);
            if (!lastSeats || lastSeats.rows !== rows || lastSeats.cols !== cols) {
                alert('Generate a seating plan for these rows and columns before exporting.');
                return;
            }
            if (!classList) {
                const seated = lastSeats.seats.flat().filter(no => no != null);
                alert(seated.length === 1
                    ? `No. ${seated[0]} is missing from the class list.`
                    : `No. ${seated.join(', No. ')} are missing from the class list.`);
                return;
            }
            if (templateKind === 'xlsx') {
                const result = await fillExcelTemplate(wordTemplate, { rows, cols, seats: lastSeats.seats, students: classList });
                if (!result.ok) {
                    alert(result.error);
                    return;
                }
                downloadBlob(result.bytes, 'Seating Plan.xlsx', 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
                return;
            }
            const xml = new TextDecoder().decode((await unzip(wordTemplate)).get('word/document.xml'));
            const result = fillDocument(xml, { rows, cols, seats: lastSeats.seats, students: classList });
            if (!result.ok) {
                alert(result.error);
                return;
            }
            const bytes = replaceZipEntry(wordTemplate, 'word/document.xml', new TextEncoder().encode(result.xml));
            downloadBlob(bytes, 'Seating Plan.docx', 'application/vnd.openxmlformats-officedocument.wordprocessingml.document');
        }

        function isSeatValid(student, row, col, assignedSeats, restrictions) {
            for (const [restricted1, restricted2] of restrictions) {
                if ((student === restricted1 && assignedSeats[restricted2] && areSeatsNear(row, col, assignedSeats[restricted2][0], assignedSeats[restricted2][1])) || 
                    (student === restricted2 && assignedSeats[restricted1] && areSeatsNear(row, col, assignedSeats[restricted1][0], assignedSeats[restricted1][1]))) {
                    return false;
                }
            }
            return true;
        }

        function areSeatsNear(row1, col1, row2, col2) {
            const rowDiff = Math.abs(row1 - row2);
            const colDiff = Math.abs(col1 - col2);
            return (rowDiff <= 1 && colDiff <= 1);
        }

        function resetForm() {
            document.getElementById('rows').value = 4;
            document.getElementById('cols').value = 8;
            document.getElementById('students').value = 32;
            document.getElementById('tall').value = '';
            document.getElementById('short').value = '';
            document.getElementById('naughty').value = '';
            document.getElementById('restrictions').value = '';
            document.getElementById('together').value = '';
            document.getElementById('container').innerHTML = '';
            const unseatedDrop = document.getElementById('unseated-drop');
            unseatedDrop.replaceChildren();
            unseatedDrop.hidden = true;
            document.getElementById('blackboard').style.display = 'none';
            document.getElementById('export-button').style.display = 'none'; // Hide export button
            classList = null;
            classListBytes = null;
            classListName = null;
            wordTemplate = null;
            templateKind = null;
            templateName = null;
            seatTypeface = null;
            lastSeats = null;
            forgetState();
            document.getElementById('class-list-file').value = '';
            document.getElementById('word-template-file').value = '';
            document.getElementById('class-list-status').textContent = '';
            document.getElementById('word-template-status').textContent = '';
        }

        function keptFileNote(kind) {
            if (kind === 'class' && classList) return ' The class list already loaded is still the one that will export.';
            if (kind === 'template' && wordTemplate) return ' The seating plan template already loaded is still the one that will export.';
            return '';
        }

        document.getElementById('download-class-list').addEventListener('click', () => {
            downloadBlob(buildClassListTemplate(), 'Class List Template.xlsx', 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
        });

        document.getElementById('class-list-file').addEventListener('change', async (event) => {
            const file = event.target.files[0];
            if (!file) return;
            if (!file.name.toLowerCase().endsWith('.xlsx')) {
                document.getElementById('class-list-status').textContent = 'Upload a .xlsx class list.' + keptFileNote('class');
                return;
            }
            const bytes = new Uint8Array(await file.arrayBuffer());
            const parsed = await parseClassList(bytes);
            if (!parsed.ok) {
                document.getElementById('class-list-status').textContent = parsed.error + keptFileNote('class');
                return;
            }
            classList = parsed.students;
            classListBytes = bytes;
            classListName = file.name;
            document.getElementById('class-list-status').textContent = `Class list loaded (${classList.size} students).`;
            rememberState();
        });

        document.getElementById('word-template-file').addEventListener('change', async (event) => {
            const file = event.target.files[0];
            if (!file) return;
            const kind = templateFileKind(file.name);
            if (!kind) {
                document.getElementById('word-template-status').textContent = TEMPLATE_FILE_ERROR + keptFileNote('template');
                return;
            }
            try {
                const bytes = new Uint8Array(await file.arrayBuffer());
                const files = kind === 'docx' ? await unzip(bytes) : null;
                const count = kind === 'xlsx'
                    ? await countExcelDesks(bytes)
                    : deskBoxes(new TextDecoder().decode(files.get('word/document.xml'))).length;
                if (!Number.isInteger(count)) throw new Error('unread');
                wordTemplate = bytes;
                templateKind = kind;
                templateName = file.name;
                seatTypeface = kind === 'xlsx'
                    ? await excelTypeface(bytes)
                    : deskTypeface(
                        new TextDecoder().decode(files.get('word/document.xml')),
                        files.get('word/styles.xml') ? new TextDecoder().decode(files.get('word/styles.xml')) : ''
                    );
                paintSeatFonts();
                document.getElementById('word-template-status').textContent = templateStatus(kind, count);
                rememberState();
            } catch {
                document.getElementById('word-template-status').textContent = (kind === 'xlsx'
                    ? 'This Excel file could not be read.'
                    : 'This Word file could not be read.') + keptFileNote('template');
            }
        });

        for (const id of RULE_IDS) {
            document.getElementById(id).addEventListener('input', rememberState);
        }

        async function restoreRemembered() {
            let saved = null;
            try { saved = JSON.parse(localStorage.getItem(REMEMBER_KEY) || 'null'); } catch { return; }
            if (!saved) return;
            restoring = true;
            try {
                if (saved.rules) {
                    for (const id of RULE_IDS) {
                        if (saved.rules[id] != null) document.getElementById(id).value = saved.rules[id];
                    }
                }
                if (saved.classList) {
                    try {
                        const bytes = base64ToBytes(saved.classList);
                        const parsed = await parseClassList(bytes);
                    if (parsed.ok) {
                        classListBytes = bytes;
                        classList = parsed.students;
                        classListName = saved.classListName || 'Class list.xlsx';
                        showRememberedUpload(document.getElementById('class-list-file'), bytes, classListName);
                        document.getElementById('class-list-status').textContent = `Class list loaded (${classList.size} students).`;
                    }
                    } catch { /* keep the rules even if the stored list cannot be read */ }
                }
                if (saved.template && (saved.templateKind === 'docx' || saved.templateKind === 'xlsx')) {
                    try {
                        const bytes = base64ToBytes(saved.template);
                        const kind = saved.templateKind;
                        const files = kind === 'docx' ? await unzip(bytes) : null;
                        const count = kind === 'xlsx'
                            ? await countExcelDesks(bytes)
                            : deskBoxes(new TextDecoder().decode(files.get('word/document.xml'))).length;
                    if (!Number.isInteger(count)) return;
                    wordTemplate = bytes;
                    templateKind = kind;
                    templateName = saved.templateName || (kind === 'xlsx' ? 'Seating plan.xlsx' : 'Seating plan.docx');
                    showRememberedUpload(document.getElementById('word-template-file'), bytes, templateName);
                    seatTypeface = kind === 'xlsx'
                            ? await excelTypeface(bytes)
                            : deskTypeface(
                                new TextDecoder().decode(files.get('word/document.xml')),
                                files.get('word/styles.xml') ? new TextDecoder().decode(files.get('word/styles.xml')) : ''
                            );
                        document.getElementById('word-template-status').textContent = templateStatus(kind, count);
                    } catch { /* the stored template is skipped if it cannot be read */ }
                }
            } finally {
                restoring = false;
            }
        }

        bindSeatDragging();
        restoreRemembered();
    </script>
</body>
</html>
