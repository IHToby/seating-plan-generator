<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seating Plan Generator</title>
    <link rel="icon" href="favicon.png?v=2" type="image/png">
    <link rel="apple-touch-icon" href="favicon.png?v=2">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent: #156872;
            --accent-soft: #e8f7fc;
            --accent-border: #b3dfe8;
            --bg: #e4f2f6;
            --card: #ffffff;
            --surface: #1b1c19;
            --surface-variant: #3f484a;
            --shadow: 0 8px 28px rgba(27, 28, 25, 0.08);
            --radius-lg: 20px;
            --font: ui-rounded, "SF Pro Rounded", "Segoe UI", system-ui, sans-serif;
        }
        * {
            box-sizing: border-box;
        }
        html,
        body {
            margin: 0;
            padding: 0;
            min-height: 100%;
            background: var(--bg);
            color: var(--surface);
            font-family: var(--font);
        }
        body {
            display: flex;
            flex-wrap: wrap;
            align-items: stretch;
            width: 100%;
        }
        .app-shell {
            width: 100%;
            flex: 1 1 100%;
            margin: 0;
            padding: 20px 24px 48px;
        }
        .top-bar {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 18px;
            min-width: 0;
        }
        .brand-logo {
            display: block;
            width: min(214px, 100%);
            height: auto;
            aspect-ratio: 1024 / 347;
            max-width: 100%;
            min-width: 0;
            object-fit: contain;
            flex: 0 1 auto;
        }
        h1 {
            margin: 0;
            font-size: 1.5rem;
            font-weight: 700;
            line-height: 1.2;
            color: var(--accent);
        }
        h2 {
            margin: 0 0 14px;
            font-size: 1.15rem;
            font-weight: 700;
            line-height: 1.25;
            color: var(--accent);
        }
        .panel-hint {
            margin: -6px 0 16px;
            color: var(--surface-variant);
            font-size: 0.875rem;
            line-height: 1.45;
        }
        .workspace {
            display: flex;
            flex-wrap: nowrap;
            align-items: stretch;
            gap: 24px;
            width: 100%;
        }
        .panel {
            background: var(--card);
            border: 1px solid var(--accent-border);
            border-radius: var(--radius-lg);
            padding: 18px;
            box-shadow: var(--shadow);
        }
        #input-container,
        #output-container {
            box-sizing: border-box;
            flex: 1 1 50%;
            width: 50%;
            min-width: 0;
            align-self: stretch;
        }
        #input-container {
            container-type: inline-size;
        }
        .input-group {
            display: grid;
            gap: 6px;
            margin: 0 0 12px;
            min-width: 0;
        }
        .input-row {
            display: grid;
            gap: 12px;
            margin-bottom: 12px;
        }
        .input-row .input-group {
            margin-bottom: 0;
        }
        label {
            display: block;
            min-width: 0;
            color: var(--surface);
            font-size: 0.92rem;
            font-weight: 700;
            line-height: 1.3;
            overflow-wrap: break-word;
        }
        input[type="number"],
        input[type="text"],
        input[type="file"] {
            width: 100%;
            min-width: 0;
            max-width: 100%;
            margin: 0;
            border: 1px solid var(--accent-border);
            border-radius: 14px;
            padding: 12px 14px;
            background: #ffffff;
            color: var(--surface);
            font: inherit;
        }
        input[type="file"] {
            padding: 10px 12px;
            font-size: 0.875rem;
        }
        input[type="file"]::file-selector-button {
            margin-right: 12px;
            border: 1px solid #b3dfe8;
            border-radius: 999px;
            background: #e8f7fc;
            color: #156872;
            padding: 8px 14px;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
        }
        input[type="file"]::-webkit-file-upload-button {
            margin-right: 12px;
            border: 1px solid #b3dfe8;
            border-radius: 999px;
            background: #e8f7fc;
            color: #156872;
            padding: 8px 14px;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
        }
        input[type="file"]::file-selector-button:hover {
            background: #d4eef6;
            filter: none;
        }
        input[type="file"]::-webkit-file-upload-button:hover {
            background: #d4eef6;
            filter: none;
        }
        input:focus-visible {
            outline: 2px solid #156872;
            outline-offset: 2px;
            box-shadow: none;
        }
        .files {
            display: grid;
            gap: 14px;
            margin: 4px 0 16px;
            padding-top: 16px;
            border-top: 1px solid var(--accent-border);
        }
        .files .input-group {
            margin-bottom: 0;
        }
        #class-list-status,
        #word-template-status {
            margin: 0;
            color: var(--surface-variant);
            font-size: 0.875rem;
            line-height: 1.45;
        }
        #class-list-status:empty,
        #word-template-status:empty {
            display: none;
        }
        .form-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        button {
            appearance: none;
            width: fit-content;
            max-width: 100%;
            margin: 0;
            padding: 10px 16px;
            border: 1px solid #156872;
            border-radius: 999px;
            background: #156872;
            color: #ffffff;
            font-family: var(--font);
            font-size: 1rem;
            font-weight: 700;
            line-height: 1.25;
            text-align: center;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(21, 104, 114, 0.35);
        }
        button:hover {
            filter: brightness(0.97);
        }
        button:active {
            filter: brightness(0.93);
        }
        button:focus-visible {
            outline: 2px solid #0e4a52;
            outline-offset: 2px;
        }
        #reset-button {
            background: #ffffff;
            color: #156872;
            border: 1px solid #b3dfe8;
            box-shadow: 0 4px 14px rgba(21, 104, 114, 0.16);
        }
        #reset-button:hover {
            background: #e8f7fc;
            filter: none;
        }
        #reset-button:active {
            background: #c9e6f2;
            filter: none;
        }
        .class-list-line {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            column-gap: 10px;
            row-gap: 6px;
            min-width: 0;
        }
        .class-list-line > label {
            flex: 0 1 auto;
            width: auto;
            margin: 0;
        }
        #download-class-list {
            flex: 0 0 auto;
            max-width: 100%;
            padding: 3px 9px;
            font-size: 0.72rem;
            line-height: 1.2;
            box-shadow: 0 2px 6px rgba(21, 104, 114, 0.28);
            background: #e8f7fc;
            color: #156872;
            border-color: #b3dfe8;
        }
        #download-class-list:hover {
            background: #d4eef6;
            filter: none;
        }
        .height-legend {
            display: flex;
            flex-wrap: wrap;
            gap: 8px 14px;
            margin: 0 0 14px;
            padding: 0;
            list-style: none;
            color: var(--surface-variant);
            font-size: 0.875rem;
            font-weight: 650;
        }
        .height-legend li {
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .swatch {
            width: 16px;
            height: 16px;
            border-radius: 5px;
            border: 1px solid rgba(27, 28, 25, 0.12);
        }
        .plan-empty {
            margin: 0 0 14px;
            color: var(--surface-variant);
            font-size: 0.875rem;
            line-height: 1.45;
        }
        #output-container:has(table) .plan-empty {
            display: none;
        }
        .unseated-drop {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 8px;
            min-height: 52px;
            margin: 0 0 14px;
            padding: 8px;
            border: 1px dashed var(--accent-border);
            border-radius: 12px;
            background: var(--accent-soft);
        }
        .unseated-drop[hidden] {
            display: none;
        }
        .unseated-drop.seat-drop-target,
        td.seat-drop-target {
            box-shadow: inset 0 0 0 2px var(--accent);
        }
        .seat-chip {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
            min-width: 72px;
            min-height: 36px;
            padding: 6px 8px;
            border: 1px solid rgba(27, 28, 25, 0.12);
            border-radius: 8px;
            cursor: grab;
            user-select: none;
        }
        td[draggable="true"] {
            cursor: grab;
            user-select: none;
        }
        td.is-dragging,
        .seat-chip.is-dragging {
            opacity: 0.45;
        }
        .plan-scroll {
            width: 100%;
            max-width: 100%;
            min-width: 0;
            overflow-x: auto;
        }
        #container {
            display: flex;
            justify-content: center;
            width: max-content;
            min-width: 100%;
        }
        table {
            border-collapse: collapse;
            width: max-content;
            flex: 0 0 auto;
            margin: 0;
            background: #ffffff;
        }
        tr {
            height: 48px;
            min-height: 48px;
        }
        td {
            border: 1px solid #d4e3e8;
            padding: 10px 8px;
            text-align: center;
            min-width: 72px;
            height: 48px;
            min-height: 48px;
            white-space: normal;
            font-weight: 650;
            vertical-align: middle;
        }
        .tall {
            background-color: #d9f2df;
        }
        .medium {
            background-color: #f3f5c8;
        }
        .short {
            background-color: #f6e4ea;
        }
        td:nth-child(2n):not(:last-child) {
            border-right: 5mm double #c4d4db;
        }
        td.tall,
        td.medium,
        td.short {
            background-clip: padding-box;
        }
        table.template-font td {
            height: 48px;
            min-height: 48px;
            font-weight: 400;
        }
        #blackboard {
            display: none;
            background-color: #156872;
            color: white;
            font-family: Chalkboard, "Patrick Hand", cursive;
            font-size: 1.35rem;
            letter-spacing: 0.02em;
            text-align: center;
            padding: 14px 16px;
            margin-top: 16px;
            border-radius: 14px;
            width: 100%;
            box-shadow: inset 0 0 0 3px rgba(255, 255, 255, 0.14);
        }
        #export-button {
            margin: 16px auto 0;
            border: 1px solid #b3dfe8;
            border-radius: 999px;
            background: #e8f7fc;
            color: #156872;
            box-shadow: none;
        }
        #export-button:hover {
            background: #d4eef6;
            filter: none;
        }
        #export-button:active {
            background: #d4eef6;
            filter: none;
        }
        @container (min-width: 540px) {
            .input-row.counts {
                grid-template-columns: repeat(3, minmax(0, 1fr));
                grid-template-rows: auto auto;
                column-gap: 12px;
                row-gap: 6px;
                align-items: stretch;
            }
            .input-row.counts .input-group {
                display: grid;
                grid-row: span 2;
                grid-template-rows: subgrid;
                gap: 6px;
            }
            .input-row.counts label {
                align-self: end;
            }
        }
        @container (min-width: 650px) {
            .input-row.heights {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                grid-template-rows: auto auto;
                column-gap: 12px;
                row-gap: 6px;
                align-items: stretch;
            }
            .input-row.heights .input-group {
                display: grid;
                grid-row: span 2;
                grid-template-rows: subgrid;
                gap: 6px;
            }
            .input-row.heights label {
                align-self: end;
            }
        }
        @media (max-width: 800px) {
            .workspace {
                flex-wrap: wrap;
            }
            #input-container,
            #output-container {
                flex: 1 1 100%;
                width: 100%;
                max-width: 100%;
            }
        }
        @media (max-width: 480px) {
            .app-shell {
                padding: 16px 16px 32px;
            }
            .panel {
                padding: 16px;
            }
            h1 {
                font-size: 1.25rem;
            }
        }
    </style>
</head>
<body>
    <div class="app-shell">
        <header class="top-bar">
            <img class="brand-logo" src="seating-plan-logo.png?v=2" alt="Seating Plan Generator">
        </header>
        <div class="workspace">
            <div id="input-container" class="panel">
                <h2>Class setup</h2>
                <div class="input-row counts">
                    <div class="input-group">
                        <label for="rows">No. of Rows:</label>
                        <input type="number" id="rows" value="4" min="1" step="1">
                    </div>
                    <div class="input-group">
                        <label for="cols">No. of Columns:</label>
                        <input type="number" id="cols" value="8" min="1" step="1">
                    </div>
                    <div class="input-group">
                        <label for="students">Total No. of Students:</label>
                        <input type="number" id="students" value="32" min="1" step="1">
                    </div>
                </div>
                <div class="input-row heights">
                    <div class="input-group">
                        <label for="tall">Tall Students (e.g. 1,3,5):</label>
                        <input type="text" id="tall" value="">
                    </div>
                    <div class="input-group">
                        <label for="short">Short Students (e.g. 20,22,24):</label>
                        <input type="text" id="short" value="">
                    </div>
                </div>
                <div class="input-group">
                    <label for="naughty">Naughty Students (sit at the front and apart; e.g. 4,6):</label>
                    <input type="text" id="naughty" value="">
                </div>
                <div class="input-group">
                    <label for="restrictions">Separate Students (e.g. 1-2,5-6):</label>
                    <input type="text" id="restrictions" value="">
                </div>
                <div class="input-group">
                    <label for="together">Pair Up Students (e.g. 3-4,7-8):</label>
                    <input type="text" id="together" value="">
                </div>
                <div class="files">
                    <div class="input-group">
                        <div class="class-list-line">
                            <label for="class-list-file">Class list (.xlsx)</label>
                            <button type="button" id="download-class-list">Download class list template</button>
                        </div>
                        <input type="file" id="class-list-file" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet">
                        <p id="class-list-status"></p>
                    </div>
                    <div class="input-group">
                        <label for="word-template-file">Seating plan template (.docx or .xlsx)</label>
                        <input type="file" id="word-template-file" accept=".docx,.xlsx,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet">
                        <p id="word-template-status"></p>
                    </div>
                </div>
                <div class="form-actions">
                    <button onclick="generatePlan()">Generate Seating Plan</button>
                    <button id="reset-button" onclick="resetForm()">Reset</button>
                </div>
            </div>

            <div id="output-container" class="panel">
                <h2>Seating plan</h2>
                <ul class="height-legend" aria-label="Seat colours">
                    <li><span class="swatch tall"></span>Tall</li>
                    <li><span class="swatch medium"></span>Medium</li>
                    <li><span class="swatch short"></span>Short</li>
                </ul>
                <p class="plan-empty">Generate a seating plan to see the seats.</p>
                <div id="unseated-drop" class="unseated-drop" hidden aria-label="Students removed from seats"></div>
                <div class="plan-scroll">
                    <div id="container"></div>
                </div>
                <div id="blackboard">Blackboard</div>
                <button id="export-button" onclick="exportToWord()" style="display: none;">Export seating plan</button>
            </div>
        </div>
    </div>

    <script>
        /* MODULES:START */
const WORD_NS = 'http://schemas.openxmlformats.org/wordprocessingml/2006/main'
const XML_NS = 'http://www.w3.org/XML/1998/namespace'

function decodeXml(text) {
  return text.replace(/&(#x[0-9a-fA-F]+|#\d+|lt|gt|quot|apos|amp);/g, (_, ent) => {
    if (ent === 'lt') return '<'
    if (ent === 'gt') return '>'
    if (ent === 'quot') return '"'
    if (ent === 'apos') return "'"
    if (ent === 'amp') return '&'
    if (ent[1] === 'x') return String.fromCodePoint(parseInt(ent.slice(2), 16))
    return String.fromCodePoint(parseInt(ent.slice(1), 10))
  })
}

function encodeXml(text) {
  return text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/\r/g, '&#xD;')
}

function encodeAttr(text) {
  return encodeXml(text).replace(/"/g, '&quot;').replace(/\n/g, '&#xA;').replace(/\t/g, '&#x9;')
}

function resolveName(qname, nsMap) {
  const colon = qname.indexOf(':')
  if (colon === -1) return { local: qname, ns: nsMap[''] || '' }
  const prefix = qname.slice(0, colon)
  return { local: qname.slice(colon + 1), ns: nsMap[prefix] || '' }
}

class Parser {
  constructor(text) {
    this.text = text.replace(/^\uFEFF/, '')
    this.i = 0
  }

  parseDocument() {
    let declaration = null
    this.skipSpace()
    if (this.text.startsWith('<?xml', this.i)) {
      const end = this.text.indexOf('?>', this.i)
      declaration = this.text.slice(this.i, end + 2)
      this.i = end + 2
    }
    this.skipMisc()
    const root = this.parseElement([])
    return { declaration, root }
  }

  skipSpace() {
    while (this.i < this.text.length && /\s/.test(this.text[this.i])) this.i++
  }

  skipMisc() {
    for (;;) {
      this.skipSpace()
      if (this.text.startsWith('<!--', this.i)) this.i = this.text.indexOf('-->', this.i) + 3
      else if (this.text.startsWith('<?', this.i)) this.i = this.text.indexOf('?>', this.i) + 2
      else if (this.text.startsWith('<!', this.i)) this.i = this.text.indexOf('>', this.i) + 1
      else break
    }
  }

  readName() {
    const start = this.i
    while (this.i < this.text.length && /[A-Za-z0-9:_.-]/.test(this.text[this.i])) this.i++
    return this.text.slice(start, this.i)
  }

  parseElement(ancestors) {
    if (this.text[this.i] !== '<') throw new Error('Expected < at ' + this.i)
    this.i++
    const name = this.readName()
    const rawAttrs = []
    for (;;) {
      this.skipSpace()
      if (this.text[this.i] === '>' || this.text[this.i] === '/') break
      const attrName = this.readName()
      this.skipSpace()
      this.i++
      this.skipSpace()
      const quote = this.text[this.i++]
      const start = this.i
      while (this.text[this.i] !== quote) this.i++
      rawAttrs.push({ name: attrName, value: decodeXml(this.text.slice(start, this.i)) })
      this.i++
    }
    const parentMap = ancestors.length
      ? ancestors[ancestors.length - 1].nsMap
      : { xml: XML_NS }
    const nsMap = { ...parentMap }
    for (const attr of rawAttrs) {
      if (attr.name === 'xmlns') nsMap[''] = attr.value
      else if (attr.name.startsWith('xmlns:')) nsMap[attr.name.slice(6)] = attr.value
    }
    const resolved = resolveName(name, nsMap)
    const el = {
      type: 'element',
      name,
      local: resolved.local,
      ns: resolved.ns,
      attrs: rawAttrs.map(attr => {
        const attrResolved = resolveName(attr.name, nsMap)
        return { name: attr.name, local: attrResolved.local, ns: attrResolved.ns, value: attr.value }
      }),
      children: [],
      nsMap
    }
    if (this.text[this.i] === '/') {
      this.i += 2
      return el
    }
    this.i++
    const stack = ancestors.concat(el)
    while (!this.text.startsWith('</', this.i)) {
      if (this.i >= this.text.length) throw new Error('Unclosed ' + name)
      if (this.text[this.i] === '<') {
        if (this.text.startsWith('<!--', this.i) || this.text.startsWith('<?', this.i) || this.text.startsWith('<!', this.i)) {
          this.skipMisc()
          continue
        }
        el.children.push(this.parseElement(stack))
      } else {
        const start = this.i
        while (this.i < this.text.length && this.text[this.i] !== '<') this.i++
        const raw = this.text.slice(start, this.i)
        if (raw) el.children.push({ type: 'text', text: decodeXml(raw) })
      }
    }
    this.i += 2
    const closeName = this.readName()
    if (closeName !== name) throw new Error('Mismatched close tag ' + closeName)
    this.skipSpace()
    this.i++
    return el
  }
}

function parseXml(text) {
  return new Parser(text).parseDocument()
}

function serializeNode(node) {
  if (node.type === 'text') return encodeXml(node.text)
  const attrs = node.attrs.map(attr => ` ${attr.name}="${encodeAttr(attr.value)}"`).join('')
  if (node.children.length === 0) return `<${node.name}${attrs}/>`
  return `<${node.name}${attrs}>${node.children.map(serializeNode).join('')}</${node.name}>`
}

function serializeXml(doc) {
  return (doc.declaration ? doc.declaration : '') + serializeNode(doc.root)
}

function cloneNode(node) {
  if (node.type === 'text') return { type: 'text', text: node.text }
  return {
    type: 'element',
    name: node.name,
    local: node.local,
    ns: node.ns,
    attrs: node.attrs.map(attr => ({ ...attr })),
    children: node.children.map(cloneNode),
    nsMap: node.nsMap
  }
}

function wordChildren(el, local) {
  return el.children.filter(child => child.type === 'element' && child.ns === WORD_NS && child.local === local)
}

function wordAttr(el, local) {
  const attr = el.attrs.find(item => item.local === local)
  return attr ? attr.value : null
}

function descendants(el, local) {
  const found = []
  for (const child of el.children) {
    if (child.type !== 'element') continue
    if (child.local === local) found.push(child)
    found.push(...descendants(child, local))
  }
  return found
}

function crc32(bytes) {
  let crc = 0xffffffff
  for (let i = 0; i < bytes.length; i++) {
    crc ^= bytes[i]
    for (let bit = 0; bit < 8; bit++) {
      const mask = -(crc & 1)
      crc = (crc >>> 1) ^ (0xedb88320 & mask)
    }
  }
  return (crc ^ 0xffffffff) >>> 0
}


const encoder = new TextEncoder()
const decoder = new TextDecoder()

function asBytes(buffer) {
  return buffer instanceof Uint8Array ? buffer : new Uint8Array(buffer)
}

function viewOf(bytes) {
  return new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength)
}

function findEocd(bytes) {
  const start = Math.max(0, bytes.length - 22 - 65535)
  for (let i = bytes.length - 22; i >= start; i--) {
    if (bytes[i] === 0x50 && bytes[i + 1] === 0x4b && bytes[i + 2] === 0x05 && bytes[i + 3] === 0x06) {
      return i
    }
  }
  throw new Error('This file is not a zip archive.')
}

function readEntries(bytes) {
  const view = viewOf(bytes)
  const eocd = findEocd(bytes)
  const count = view.getUint16(eocd + 10, true)
  let ptr = view.getUint32(eocd + 16, true)
  const entries = []
  for (let i = 0; i < count; i++) {
    if (view.getUint32(ptr, true) !== 0x02014b50) throw new Error('Bad central directory')
    const flags = view.getUint16(ptr + 8, true)
    const method = view.getUint16(ptr + 10, true)
    const time = view.getUint16(ptr + 12, true)
    const date = view.getUint16(ptr + 14, true)
    const crc = view.getUint32(ptr + 16, true)
    const compressedSize = view.getUint32(ptr + 20, true)
    const uncompressedSize = view.getUint32(ptr + 24, true)
    const nameLen = view.getUint16(ptr + 28, true)
    const extraLen = view.getUint16(ptr + 30, true)
    const commentLen = view.getUint16(ptr + 32, true)
    const localOffset = view.getUint32(ptr + 42, true)
    const name = decoder.decode(bytes.subarray(ptr + 46, ptr + 46 + nameLen))
    const localNameLen = view.getUint16(localOffset + 26, true)
    const localExtraLen = view.getUint16(localOffset + 28, true)
    const dataStart = localOffset + 30 + localNameLen + localExtraLen
    const data = bytes.slice(dataStart, dataStart + compressedSize)
    entries.push({ name, flags, method, time, date, crc, compressedSize, uncompressedSize, data })
    ptr += 46 + nameLen + extraLen + commentLen
  }
  return entries
}

async function inflateRaw(bytes) {
  const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'))
  return new Uint8Array(await new Response(stream).arrayBuffer())
}

function concat(parts) {
  const size = parts.reduce((sum, part) => sum + part.length, 0)
  const out = new Uint8Array(size)
  let offset = 0
  for (const part of parts) {
    out.set(part, offset)
    offset += part.length
  }
  return out
}

function u16(value) {
  const bytes = new Uint8Array(2)
  new DataView(bytes.buffer).setUint16(0, value, true)
  return bytes
}

function u32(value) {
  const bytes = new Uint8Array(4)
  new DataView(bytes.buffer).setUint32(0, value, true)
  return bytes
}

function writeZip(entries) {
  const locals = []
  const centrals = []
  let offset = 0
  for (const entry of entries) {
    const name = encoder.encode(entry.name)
    const local = concat([
      u32(0x04034b50), u16(20), u16(entry.flags), u16(entry.method),
      u16(entry.time), u16(entry.date), u32(entry.crc),
      u32(entry.compressedSize), u32(entry.uncompressedSize),
      u16(name.length), u16(0), name, entry.data
    ])
    locals.push(local)
    centrals.push(concat([
      u32(0x02014b50), u16(20), u16(20), u16(entry.flags), u16(entry.method),
      u16(entry.time), u16(entry.date), u32(entry.crc),
      u32(entry.compressedSize), u32(entry.uncompressedSize),
      u16(name.length), u16(0), u16(0), u16(0), u16(0), u32(0), u32(offset), name
    ]))
    offset += local.length
  }
  const central = concat(centrals)
  const eocd = concat([
    u32(0x06054b50), u16(0), u16(0), u16(entries.length), u16(entries.length),
    u32(central.length), u32(offset), u16(0)
  ])
  return concat([...locals, central, eocd])
}

function zipStored(files) {
  return writeZip(files.map(file => ({
    name: file.name,
    flags: 0x800,
    method: 0,
    time: 0,
    date: 0,
    crc: crc32(file.data),
    compressedSize: file.data.length,
    uncompressedSize: file.data.length,
    data: file.data
  })))
}

async function unzip(buffer) {
  const entries = readEntries(asBytes(buffer))
  const files = new Map()
  for (const entry of entries) {
    let data = entry.data
    if (entry.method === 8) data = await inflateRaw(data)
    else if (entry.method !== 0) throw new Error('Unsupported zip compression ' + entry.method)
    files.set(entry.name, data)
  }
  return files
}

function replaceZipEntry(buffer, entryName, contents) {
  const entries = readEntries(asBytes(buffer))
  const entry = entries.find(item => item.name === entryName)
  if (!entry) throw new Error('Missing zip entry ' + entryName)
  entry.method = 0
  entry.flags = (entry.flags & ~0x8) | 0x800
  entry.crc = crc32(contents)
  entry.compressedSize = contents.length
  entry.uncompressedSize = contents.length
  entry.data = contents
  return writeZip(entries)
}

function isHan(char) {
  return /\p{Script=Han}/u.test(char)
}

function matchLatin(text, index) {
  const word = "[A-Za-z]+(?:['’-][A-Za-z]+)*"
  const match = text.slice(index).match(new RegExp('^' + word + '(?: ' + word + ')*'))
  return match ? match[0] : ''
}

function tokenize(text) {
  const tokens = []
  let index = 0
  while (index < text.length) {
    const rest = text.slice(index)
    const classMatch = rest.match(/^(\d+)([A-Za-z])(?![A-Za-z0-9])/)
    if (classMatch) {
      tokens.push({ type: 'class', value: classMatch[0], start: index, end: index + classMatch[0].length })
      index += classMatch[0].length
      continue
    }
    const integerMatch = rest.match(/^\d+/)
    if (integerMatch) {
      tokens.push({ type: 'classNo', value: integerMatch[0], start: index, end: index + integerMatch[0].length })
      index += integerMatch[0].length
      continue
    }
    if (isHan(text[index])) {
      let end = index + 1
      while (end < text.length && isHan(text[end])) end++
      tokens.push({ type: 'chiName', value: text.slice(index, end), start: index, end })
      index = end
      continue
    }
    const latin = matchLatin(text, index)
    if (latin) {
      const words = latin.split(' ')
      tokens.push({
        type: words.length >= 2 ? 'engName' : 'nickname',
        value: latin,
        start: index,
        end: index + latin.length
      })
      index += latin.length
      continue
    }
    index++
  }
  return tokens
}

function seatLabel(student, no) {
  const chi = student?.chiName?.trim() || ''
  const eng = student?.engName?.trim() || ''
  if (chi) return chi
  if (eng) return eng
  return String(no)
}

function fieldValue(student, field) {
  if (field === 'class') return student.className || ''
  if (field === 'classNo') return student.classNo || ''
  if (field === 'chiName') return student.chiName || ''
  if (field === 'engName') return student.engName || ''
  if (field === 'nickname') return student.nickname || ''
  return ''
}

function choosePattern(sequences) {
  const groups = new Map()
  sequences.forEach((sequence, index) => {
    const key = sequence.join('\0')
    if (!groups.has(key)) groups.set(key, { sequence, count: 0, index })
    groups.get(key).count++
  })
  let best = null
  for (const group of groups.values()) {
    if (
      !best ||
      group.count > best.count ||
      (group.count === best.count && group.sequence.length > best.sequence.length) ||
      (group.count === best.count && group.sequence.length === best.sequence.length && group.index < best.index)
    ) {
      best = group
    }
  }
  return best ? best.sequence : []
}

function bytesFromBase64(value) {
  const binary = atob(value.replace(/\s/g, ''))
  const bytes = new Uint8Array(binary.length)
  for (let index = 0; index < binary.length; index++) bytes[index] = binary.charCodeAt(index)
  return bytes
}

function buildClassListTemplate() {
  return bytesFromBase64(CLASS_LIST_TEMPLATE_BASE64)
}

function columnIndex(ref) {
  const letters = ref.match(/^[A-Z]+/)[0]
  let number = 0
  for (const char of letters) number = number * 26 + char.charCodeAt(0) - 64
  return number - 1
}

function elementText(el) {
  let value = ''
  for (const child of el.children) {
    if (child.type === 'text') value += child.text
    else value += elementText(child)
  }
  return value
}

function sharedStrings(files) {
  const file = files.get('xl/sharedStrings.xml')
  if (!file) return []
  const doc = parseXml(new TextDecoder().decode(file))
  return descendants(doc.root, 'si').map(elementText)
}

async function firstSheet(files) {
  const workbook = parseXml(new TextDecoder().decode(files.get('xl/workbook.xml')))
  const sheet = descendants(workbook.root, 'sheet')[0]
  const relId = sheet.attrs.find(attr => attr.local === 'id').value
  const rels = parseXml(new TextDecoder().decode(files.get('xl/_rels/workbook.xml.rels')))
  const rel = descendants(rels.root, 'Relationship').find(item => item.attrs.some(attr => attr.local === 'Id' && attr.value === relId))
  let target = rel.attrs.find(attr => attr.local === 'Target').value
  target = target.replace(/^\/?xl\//, 'xl/')
  if (!target.startsWith('xl/')) target = 'xl/' + target.replace(/^\//, '')
  return files.get(target)
}

function headerAt(name) {
  return CLASS_LIST_HEADERS.indexOf(name)
}

async function parseClassList(buffer) {
  try {
    const files = await unzip(buffer)
    const sheetBytes = await firstSheet(files)
    if (!sheetBytes) return { ok: false, error: 'This Excel file could not be read.' }
    const strings = sharedStrings(files)
    const doc = parseXml(new TextDecoder().decode(sheetBytes))
    const rows = descendants(doc.root, 'row')
    const table = rows.map(row => {
      const values = []
      for (const cell of row.children.filter(child => child.type === 'element' && child.local === 'c')) {
        const ref = cell.attrs.find(attr => attr.local === 'r').value
        const type = cell.attrs.find(attr => attr.local === 't')?.value
        let value = ''
        if (type === 's') value = strings[Number(elementText(descendants(cell, 'v')[0] || { children: [] }))] || ''
        else if (type === 'inlineStr') value = elementText(descendants(cell, 'is')[0] || { children: [] })
        else value = elementText(descendants(cell, 'v')[0] || { children: [] })
        values[columnIndex(ref)] = value
      }
      return values
    })
    const headers = CLASS_LIST_HEADERS.map((_, index) => (table[0]?.[index] || '').trim())
    if (headers.some((header, index) => header !== CLASS_LIST_HEADERS[index])) {
      return { ok: false, error: HEADER_ERROR }
    }
    const students = new Map()
    for (let index = 1; index < table.length; index++) {
      const row = table[index]
      const cells = CLASS_LIST_HEADERS.map((_, column) => (row[column] || '').trim())
      if (cells.every(cell => cell === '')) continue
      const rowNumber = Number(rows[index].attrs.find(attr => attr.local === 'r')?.value || index + 1)
      const noText = cells[headerAt('No.')]
      const classNoText = cells[headerAt('Class no.')]
      if (noText === '') return { ok: false, error: `Row ${rowNumber} has student information but no No.` }
      if (!/^[1-9]\d*$/.test(noText.replace(/^0+(?=\d)/, ''))) {
        return { ok: false, error: `Row ${rowNumber} has a No. that is not a whole number of 1 or more.` }
      }
      const no = Number(noText)
      if (students.has(no)) return { ok: false, error: `No. ${no} appears more than once.` }
      if (classNoText !== '' && !/^\d+$/.test(classNoText)) {
        return { ok: false, error: `Row ${rowNumber} has a Class no. that is not a whole number.` }
      }
      students.set(no, {
        no,
        className: cells[headerAt('Class')],
        classNo: classNoText === '' ? '' : String(Number(classNoText)),
        chiName: cells[headerAt('Chi Name')],
        engName: cells[headerAt('Eng Name')],
        nickname: cells[headerAt('Nickname')]
      })
    }
    return { ok: true, students }
  } catch {
    return { ok: false, error: 'This Excel file could not be read.' }
  }
}


function paragraphText(paragraph) {
  let text = ''
  function walk(node) {
    for (const child of node.children || []) {
      if (child.type === 'text') continue
      if (child.ns === WORD_NS && child.local === 't') {
        text += child.children.filter(item => item.type === 'text').map(item => item.text).join('')
      } else walk(child)
    }
  }
  walk(paragraph)
  return text
}

function isDesk(cell) {
  const borders = wordChildren(wordChildren(cell, 'tcPr')[0] || { children: [] }, 'tcBorders')[0]
  if (!borders) return false
  return ['top', 'left', 'bottom', 'right'].every(side => {
    const edge = wordChildren(borders, side)[0]
    if (!edge) return false
    const value = edge.attrs.find(attr => attr.local === 'val')?.value
    return value && value !== 'nil'
  })
}

function mostCommon(counts) {
  let best = ''
  let seen = 0
  for (const [key, count] of counts) {
    if (count > seen) {
      best = key
      seen = count
    }
  }
  return best
}

function defaultFaces(stylesXml) {
  const empty = { cjk: '', latin: '' }
  if (!stylesXml) return empty
  const defaults = wordChildren(parseXml(stylesXml).root, 'docDefaults')[0]
  const fonts = defaults && descendants(defaults, 'rFonts')[0]
  if (!fonts) return empty
  return {
    cjk: wordAttr(fonts, 'eastAsia') || '',
    latin: wordAttr(fonts, 'ascii') || wordAttr(fonts, 'hAnsi') || ''
  }
}

function faceAt(paragraph, offset, script, defaults) {
  const sources = []
  const runProps = rPrAt(runsOf(paragraph), offset)
  if (runProps) sources.push(runProps)
  const mark = wordChildren(wordChildren(paragraph, 'pPr')[0] || { children: [] }, 'rPr')[0]
  if (mark) sources.push(mark)
  let name = ''
  for (const props of sources) {
    const fonts = wordChildren(props, 'rFonts')[0]
    if (!fonts) continue
    name = script === 'cjk'
      ? (wordAttr(fonts, 'eastAsia') || '')
      : (wordAttr(fonts, 'ascii') || wordAttr(fonts, 'hAnsi') || '')
    if (name) break
  }
  if (!name) name = script === 'cjk' ? defaults.cjk : defaults.latin
  let half = NaN
  for (const props of sources) {
    const sz = wordChildren(props, 'sz')[0]
    half = Number(sz ? wordAttr(sz, 'val') : NaN)
    if (Number.isFinite(half) && half > 0) break
  }
  return { name, pt: Number.isFinite(half) && half > 0 ? half / 2 : 0 }
}

function deskTypeface(documentXml, stylesXml = '') {
  const defaults = defaultFaces(stylesXml)
  const names = { cjk: new Map(), latin: new Map() }
  const sizes = { cjk: new Map(), latin: new Map() }
  for (const box of deskBoxes(documentXml)) {
    for (const paragraph of wordChildren(box, 'p')) {
      const text = paragraphText(paragraph)
      for (const token of tokenize(text)) {
        const script = token.type === 'chiName' ? 'cjk' : 'latin'
        const face = faceAt(paragraph, token.start, script, defaults)
        if (face.name) names[script].set(face.name, (names[script].get(face.name) || 0) + 1)
        if (face.pt) sizes[script].set(String(face.pt), (sizes[script].get(String(face.pt)) || 0) + 1)
      }
    }
  }
  return {
    cjk: mostCommon(names.cjk) || defaults.cjk,
    latin: mostCommon(names.latin) || defaults.latin,
    cjkPt: Number(mostCommon(sizes.cjk)) || 0,
    latinPt: Number(mostCommon(sizes.latin)) || 0
  }
}

function deskBoxes(documentXml) {
  const doc = parseXml(documentXml)
  const body = wordChildren(doc.root, 'body')[0]
  const table = body ? wordChildren(body, 'tbl')[0] : null
  if (!table) return []
  const boxes = []
  for (const row of wordChildren(table, 'tr')) {
    for (const cell of wordChildren(row, 'tc')) {
      if (isDesk(cell)) boxes.push(cell)
    }
  }
  return boxes
}

function sequenceOf(cell) {
  const sequence = []
  for (const paragraph of wordChildren(cell, 'p')) {
    for (const token of tokenize(paragraphText(paragraph))) sequence.push(token.type)
  }
  return sequence
}

function templatePattern(documentXml) {
  return choosePattern(deskBoxes(documentXml).map(sequenceOf).filter(sequence => sequence.length > 0))
}

function runsOf(paragraph) {
  const runs = []
  let offset = 0
  function walk(node) {
    for (const child of node.children) {
      if (child.type !== 'element') continue
      if (child.ns === WORD_NS && child.local === 'r') {
        const rPr = wordChildren(child, 'rPr')[0] || null
        for (const textNode of wordChildren(child, 't')) {
          const text = textNode.children.filter(item => item.type === 'text').map(item => item.text).join('')
          runs.push({ rPr, start: offset, end: offset + text.length })
          offset += text.length
        }
      } else walk(child)
    }
  }
  walk(paragraph)
  return runs
}

function rPrAt(runs, offset) {
  const run = runs.find(item => offset >= item.start && offset < item.end) || runs[0]
  return run?.rPr ? cloneNode(run.rPr) : null
}

const TIMES_WIDTH = {
  ' ': 250, "'": 180, '-': 333, '.': 250,
  '0': 500, '1': 500, '2': 500, '3': 500, '4': 500, '5': 500, '6': 500, '7': 500, '8': 500, '9': 500,
  A: 722, B: 667, C: 667, D: 722, E: 611, F: 556, G: 722, H: 722, I: 333, J: 389,
  K: 722, L: 611, M: 889, N: 722, O: 722, P: 556, Q: 722, R: 667, S: 556, T: 611,
  U: 722, V: 722, W: 944, X: 722, Y: 722, Z: 611,
  a: 444, b: 500, c: 444, d: 500, e: 444, f: 333, g: 500, h: 500, i: 278, j: 278,
  k: 500, l: 278, m: 778, n: 500, o: 500, p: 500, q: 500, r: 333, s: 389, t: 278,
  u: 500, v: 500, w: 722, x: 500, y: 500, z: 444
}

function dxaValue(node, fallback) {
  if (!node) return fallback
  if ((wordAttr(node, 'type') || 'dxa') !== 'dxa') return fallback
  const value = Number(wordAttr(node, 'w'))
  return Number.isFinite(value) ? value : fallback
}

function tableSideMargins(table) {
  const mar = table ? wordChildren(wordChildren(table, 'tblPr')[0] || { children: [] }, 'tblCellMar')[0] : null
  return {
    left: dxaValue(mar && wordChildren(mar, 'left')[0], 108),
    right: dxaValue(mar && wordChildren(mar, 'right')[0], 108)
  }
}

function englishLineWidth(cell, margins) {
  const tcPr = wordChildren(cell, 'tcPr')[0]
  const tcW = tcPr && wordChildren(tcPr, 'tcW')[0]
  if (!tcW || (wordAttr(tcW, 'type') || 'dxa') !== 'dxa') return null
  const total = Number(wordAttr(tcW, 'w'))
  if (!Number.isFinite(total) || total <= 0) return null
  const tcMar = wordChildren(tcPr, 'tcMar')[0]
  const left = dxaValue(tcMar && wordChildren(tcMar, 'left')[0], margins.left)
  const right = dxaValue(tcMar && wordChildren(tcMar, 'right')[0], margins.right)
  return Math.max(120, total - left - right - 40)
}

function latinFont(paragraph) {
  for (const fonts of descendants(paragraph, 'rFonts')) {
    const name = wordAttr(fonts, 'ascii') || wordAttr(fonts, 'hAnsi')
    if (name) return name
  }
  return 'Times New Roman'
}

function textWidthTwips(text, halfPoints, fontName) {
  const wide = !/times/i.test(fontName || '')
  let units = 0
  for (const ch of text) {
    let width = TIMES_WIDTH[ch]
    if (width == null) width = ch.codePointAt(0) > 255 ? 1000 : 722
    if (wide) width = Math.round(width * 1.08)
    units += width
  }
  return units / 100 * halfPoints
}

function currentHalfPoints(paragraph) {
  const run = wordChildren(paragraph, 'r')[0]
  const sz = run && wordChildren(wordChildren(run, 'rPr')[0] || { children: [] }, 'sz')[0]
  const value = Number(sz ? wordAttr(sz, 'val') : NaN)
  return Number.isFinite(value) && value > 0 ? value : 22
}

function ensureSize(rPr, halfPoints) {
  for (const local of ['sz', 'szCs']) {
    let node = wordChildren(rPr, local)[0]
    if (!node) {
      node = { type: 'element', name: 'w:' + local, local, ns: WORD_NS, attrs: [], children: [], nsMap: {} }
      rPr.children.push(node)
    }
    const attr = node.attrs.find(item => item.local === 'val')
    if (attr) attr.value = String(halfPoints)
    else node.attrs.push({ name: 'w:val', local: 'val', ns: WORD_NS, value: String(halfPoints) })
  }
}

let fitTextId = 1

function fitEnglishLine(paragraph, widthTwips) {
  if (!widthTwips) return
  const text = paragraphText(paragraph)
  if (!text) return
  const fontName = latinFont(paragraph)
  let size = currentHalfPoints(paragraph)
  if (textWidthTwips(text, size, fontName) <= widthTwips) return
  while (size > 12 && textWidthTwips(text, size, fontName) > widthTwips) size -= 1
  const props = []
  const pPr = wordChildren(paragraph, 'pPr')[0]
  const mark = pPr && wordChildren(pPr, 'rPr')[0]
  if (mark) props.push(mark)
  for (const run of wordChildren(paragraph, 'r')) {
    let rPr = wordChildren(run, 'rPr')[0]
    if (!rPr) {
      rPr = { type: 'element', name: 'w:rPr', local: 'rPr', ns: WORD_NS, attrs: [], children: [], nsMap: {} }
      run.children.unshift(rPr)
    }
    props.push(rPr)
  }
  for (const rPr of props) ensureSize(rPr, size)
  if (textWidthTwips(text, size, fontName) <= widthTwips) return
  for (const rPr of props) {
    rPr.children.push({
      type: 'element', name: 'w:fitText', local: 'fitText', ns: WORD_NS, attrs: [
        { name: 'w:val', local: 'val', ns: WORD_NS, value: String(Math.round(widthTwips)) },
        { name: 'w:id', local: 'id', ns: WORD_NS, value: String(fitTextId++) }
      ], children: [], nsMap: {}
    })
  }
}

function makeRun(rPr, text) {
  const textNode = {
    type: 'element', name: 'w:t', local: 't', ns: WORD_NS, attrs: [], children: [{ type: 'text', text }], nsMap: {}
  }
  if (/^\s|\s$|\s{2}/.test(text)) {
    textNode.attrs.push({ name: 'xml:space', local: 'space', ns: 'http://www.w3.org/XML/1998/namespace', value: 'preserve' })
  }
  return {
    type: 'element', name: 'w:r', local: 'r', ns: WORD_NS, attrs: [], nsMap: {},
    children: rPr ? [rPr, textNode] : [textNode]
  }
}

function rewriteParagraph(paragraph, student, pattern) {
  const text = paragraphText(paragraph)
  const tokens = tokenize(text)
  const runs = runsOf(paragraph)
  const pieces = []
  let cursor = 0
  for (const token of tokens) {
    if (cursor < token.start) pieces.push({ kind: 'gap', start: cursor, end: token.start, text: text.slice(cursor, token.start) })
    const value = pattern.includes(token.type) ? fieldValue(student, token.type) : ''
    pieces.push({ kind: 'token', token, text: value, omit: value === '' })
    cursor = token.end
  }
  if (cursor < text.length) pieces.push({ kind: 'gap', start: cursor, end: text.length, text: text.slice(cursor) })
  const visible = pieces.filter(piece => {
    if (piece.kind === 'token') return !piece.omit
    if (!/^[\s]*$/.test(piece.text)) return true
    const before = [...pieces].reverse().find(item => item.kind === 'token' && item.token.end <= piece.start)
    const after = pieces.find(item => item.kind === 'token' && item.token.start >= piece.end)
    return !(before?.omit || after?.omit)
  })
  const pPr = wordChildren(paragraph, 'pPr')[0]
  paragraph.children = pPr ? [pPr] : []
  for (const piece of visible) {
    if (!piece.text) continue
    const offset = piece.kind === 'token' ? piece.token.start : piece.start
    paragraph.children.push(makeRun(rPrAt(runs, offset), piece.text))
  }
  return paragraphText(paragraph) !== ''
}

function makeParagraph(pPr, rPr, text) {
  const paragraph = { type: 'element', name: 'w:p', local: 'p', ns: WORD_NS, attrs: [], children: [], nsMap: {} }
  if (pPr) paragraph.children.push(pPr)
  paragraph.children.push(makeRun(rPr, text))
  return paragraph
}

function captureSamples(boxes) {
  const samples = new Map()
  for (const box of boxes) {
    for (const paragraph of wordChildren(box, 'p')) {
      const tokens = tokenize(paragraphText(paragraph))
      if (tokens.length === 1 && !samples.has(tokens[0].type)) samples.set(tokens[0].type, cloneNode(paragraph))
    }
  }
  for (const box of boxes) {
    for (const paragraph of wordChildren(box, 'p')) {
      const tokens = tokenize(paragraphText(paragraph))
      const runs = runsOf(paragraph)
      for (const token of tokens) {
        if (samples.has(token.type)) continue
        const pPr = wordChildren(paragraph, 'pPr')[0]
        samples.set(token.type, makeParagraph(pPr ? cloneNode(pPr) : null, rPrAt(runs, token.start), token.value))
      }
    }
  }
  return samples
}

function sampleWithValue(sample, field, value) {
  const paragraph = cloneNode(sample)
  const student = { className: '', classNo: '', chiName: '', engName: '', nickname: '' }
  if (field === 'class') student.className = value
  if (field === 'classNo') student.classNo = value
  if (field === 'chiName') student.chiName = value
  if (field === 'engName') student.engName = value
  if (field === 'nickname') student.nickname = value
  rewriteParagraph(paragraph, student, [field])
  return paragraph
}

function writeBox(cell, pattern, student, samples, widthTwips) {
  const paragraphs = wordChildren(cell, 'p')
  const located = []
  for (const paragraph of paragraphs) {
    for (const token of tokenize(paragraphText(paragraph))) located.push({ type: token.type, paragraph })
  }
  const visible = new Set()
  for (const paragraph of paragraphs) {
    if (rewriteParagraph(paragraph, student, pattern)) visible.add(paragraph)
  }
  const used = new Set()
  const ordered = []
  const english = new Set()
  for (const field of pattern) {
    const value = fieldValue(student, field)
    if (!value) continue
    const found = located.find(item => item.type === field && !used.has(item) && visible.has(item.paragraph))
    if (found) {
      used.add(found)
      if (!ordered.includes(found.paragraph)) ordered.push(found.paragraph)
      if (field === 'engName') english.add(found.paragraph)
    } else if (samples.has(field)) {
      const added = sampleWithValue(samples.get(field), field, value)
      ordered.push(added)
      if (field === 'engName') english.add(added)
    }
  }
  const staticChildren = cell.children.filter(child => !(child.type === 'element' && child.ns === WORD_NS && child.local === 'p'))
  cell.children = [...staticChildren, ...ordered]
  for (const paragraph of english) fitEnglishLine(paragraph, widthTwips)
  if (!wordChildren(cell, 'p').length) {
    cell.children.push({ type: 'element', name: 'w:p', local: 'p', ns: WORD_NS, attrs: [], children: [], nsMap: {} })
  }
}

function clearBox(cell) {
  const first = wordChildren(cell, 'p')[0]
  const pPr = first ? wordChildren(first, 'pPr')[0] : null
  cell.children = cell.children.filter(child => !(child.type === 'element' && child.ns === WORD_NS && child.local === 'p'))
  const paragraph = { type: 'element', name: 'w:p', local: 'p', ns: WORD_NS, attrs: [], children: [], nsMap: {} }
  if (pPr) paragraph.children.push(cloneNode(pPr))
  cell.children.push(paragraph)
}

function fillDocument(documentXml, options) {
  const doc = parseXml(documentXml)
  const body = wordChildren(doc.root, 'body')[0]
  const table = body ? wordChildren(body, 'tbl')[0] : null
  const boxes = []
  if (table) {
    for (const row of wordChildren(table, 'tr')) {
      for (const cell of wordChildren(row, 'tc')) if (isDesk(cell)) boxes.push(cell)
    }
  }
  const expected = options.rows * options.cols
  if (boxes.length !== expected) {
    return {
      ok: false,
      error: `This Word file has ${boxes.length} desk boxes, and the page is set to ${options.rows} rows by ${options.cols} columns (${expected} seats).`
    }
  }
  const missing = []
  for (const row of options.seats) {
    for (const no of row) if (no != null && !options.students.has(no)) missing.push(no)
  }
  if (missing.length === 1) return { ok: false, error: `No. ${missing[0]} is missing from the class list.` }
  if (missing.length > 1) return { ok: false, error: `No. ${missing.join(', No. ')} are missing from the class list.` }
  const pattern = choosePattern(boxes.map(sequenceOf).filter(sequence => sequence.length > 0))
  const occupied = options.seats.some(row => row.some(no => no != null))
  if (occupied && pattern.length === 0) {
    return { ok: false, error: 'This Word file has no student text in its desk boxes, so the font and fields cannot be copied.' }
  }
  const samples = captureSamples(boxes)
  const margins = tableSideMargins(table)
  options.seats.forEach((row, rowIndex) => {
    row.forEach((no, colIndex) => {
      const cell = boxes[rowIndex * options.cols + colIndex]
      if (no == null) clearBox(cell)
      else writeBox(cell, pattern, options.students.get(no), samples, englishLineWidth(cell, margins))
    })
  })
  return { ok: true, xml: serializeXml(doc) }
}


const SHEET_NS = 'http://schemas.openxmlformats.org/spreadsheetml/2006/main'

const TEMPLATE_FILE_ERROR = 'This page needs a .docx or .xlsx seating plan.'

function templateFileKind(name) {
  const lower = String(name || '').toLowerCase()
  if (lower.endsWith('.docx')) return 'docx'
  if (lower.endsWith('.xlsx')) return 'xlsx'
  return ''
}

function templateStatus(kind, count) {
  if (kind === 'xlsx') return `Excel template loaded (${count} desk cells).`
  return `Template loaded (${count} desk boxes).`
}

function sheetAttr(el, local) {
  if (!el) return null
  const found = el.attrs.find(attr => attr.local === local)
  return found ? found.value : null
}

function sheetText(el) {
  if (!el) return ''
  let value = ''
  for (const child of el.children) {
    if (child.type === 'text') value += child.text
    else value += sheetText(child)
  }
  return value
}

function directKids(el, local) {
  if (!el) return []
  return el.children.filter(child => child.type === 'element' && child.local === local)
}

function columnNumber(letters) {
  let number = 0
  for (const char of letters) number = number * 26 + char.charCodeAt(0) - 64
  return number
}

function splitRef(ref) {
  const match = /^\$?([A-Za-z]+)\$?(\d+)$/.exec(String(ref || '').trim())
  if (!match) return null
  return { col: columnNumber(match[1].toUpperCase()), row: Number(match[2]) }
}

function isBoxBorder(border) {
  return ['left', 'right', 'top', 'bottom'].every(side => {
    const edge = directKids(border, side)[0]
    if (!edge) return false
    const style = sheetAttr(edge, 'style')
    return !!style && style !== 'none' && style !== 'nil'
  })
}

function boxStyleIndexes(stylesXml) {
  const doc = parseXml(stylesXml)
  const borders = directKids(directKids(doc.root, 'borders')[0], 'border')
  const boxed = new Set()
  borders.forEach((border, index) => {
    if (isBoxBorder(border)) boxed.add(index)
  })
  const styles = new Set()
  directKids(directKids(doc.root, 'cellXfs')[0], 'xf').forEach((xf, index) => {
    const apply = sheetAttr(xf, 'applyBorder')
    if (apply === '0' || apply === 'false') return
    const borderId = Number(sheetAttr(xf, 'borderId'))
    if (boxed.has(borderId)) styles.add(index)
  })
  return styles
}

function mergeRanges(doc) {
  const ranges = []
  for (const merge of descendants(doc.root, 'mergeCell')) {
    const [start, end] = (sheetAttr(merge, 'ref') || '').split(':')
    const a = splitRef(start)
    const b = splitRef(end || start)
    if (!a || !b) continue
    ranges.push({
      r1: Math.min(a.row, b.row),
      r2: Math.max(a.row, b.row),
      c1: Math.min(a.col, b.col),
      c2: Math.max(a.col, b.col)
    })
  }
  return ranges
}

function runText(run) {
  let value = ''
  for (const node of directKids(run, 't')) value += sheetText(node)
  return value
}

function textAndRuns(container) {
  if (!container) return { text: '', runs: [] }
  const rich = directKids(container, 'r')
  if (rich.length) {
    const runs = []
    let value = ''
    for (const run of rich) {
      const piece = runText(run)
      runs.push({
        rPr: directKids(run, 'rPr')[0] || null,
        start: value.length,
        end: value.length + piece.length
      })
      value += piece
    }
    return { text: value, runs }
  }
  let value = ''
  for (const node of directKids(container, 't')) value += sheetText(node)
  return { text: value, runs: [] }
}

function valueInfo(cell, strings) {
  const type = sheetAttr(cell, 't')
  if (type === 'inlineStr') return textAndRuns(directKids(cell, 'is')[0])
  if (type === 's') {
    const index = Number(sheetText(directKids(cell, 'v')[0]))
    return textAndRuns(strings[index])
  }
  return { text: sheetText(directKids(cell, 'v')[0]), runs: [] }
}

function gridDesks(doc, boxedStyles, strings) {
  const ranges = mergeRanges(doc)
  const candidates = []
  for (const cell of descendants(doc.root, 'c')) {
    const ref = splitRef(sheetAttr(cell, 'r'))
    if (!ref) continue
    if (!boxedStyles.has(Number(sheetAttr(cell, 's') || '0'))) continue
    const merge = ranges.find(range => ref.row >= range.r1 && ref.row <= range.r2 && ref.col >= range.c1 && ref.col <= range.c2)
    if (merge && (merge.c1 !== merge.c2 || ref.row !== merge.r1 || ref.col !== merge.c1)) continue
    const info = valueInfo(cell, strings)
    candidates.push({ cell, row: ref.row, col: ref.col, text: info.text, runs: info.runs })
  }
  const byRow = new Map()
  for (const item of candidates) {
    if (!byRow.has(item.row)) byRow.set(item.row, [])
    byRow.get(item.row).push(item)
  }
  const groups = []
  for (const [row, items] of byRow) {
    items.sort((a, b) => a.col - b.col)
    groups.push({ row, key: items.map(item => item.col).join(','), cols: items.map(item => item.col), items })
  }
  if (!groups.length) return []
  const tally = new Map()
  for (const group of groups) {
    if (!tally.has(group.key)) tally.set(group.key, { key: group.key, count: 0, cols: group.cols, row: group.row })
    const bucket = tally.get(group.key)
    bucket.count++
    if (group.row < bucket.row) bucket.row = group.row
  }
  let best = null
  for (const bucket of tally.values()) {
    if (
      !best ||
      bucket.count > best.count ||
      (bucket.count === best.count && bucket.cols.length > best.cols.length) ||
      (bucket.count === best.count && bucket.cols.length === best.cols.length && bucket.row < best.row)
    ) best = bucket
  }
  return groups.filter(group => group.key === best.key).sort((a, b) => a.row - b.row).flatMap(group => group.items)
}

function mustDecode(files, name) {
  const data = files.get(name)
  if (!data) throw new Error('Missing ' + name)
  return new TextDecoder().decode(data)
}

function excelTarget(target) {
  let path = String(target || '').replace(/^\/?xl\//, 'xl/')
  if (!path.startsWith('xl/')) path = 'xl/' + path.replace(/^\//, '')
  return path
}

function worksheetPaths(files) {
  const workbook = parseXml(mustDecode(files, 'xl/workbook.xml'))
  const rels = parseXml(mustDecode(files, 'xl/_rels/workbook.xml.rels'))
  const byId = new Map()
  for (const rel of descendants(rels.root, 'Relationship')) byId.set(sheetAttr(rel, 'Id'), rel)
  const paths = []
  for (const sheet of descendants(workbook.root, 'sheet')) {
    const rel = byId.get(sheetAttr(sheet, 'id'))
    if (!rel) continue
    const type = sheetAttr(rel, 'Type') || ''
    if (!type.endsWith('/worksheet')) continue
    paths.push(excelTarget(sheetAttr(rel, 'Target')))
  }
  return paths
}

function stringNodes(xml) {
  if (!xml) return []
  return descendants(parseXml(xml).root, 'si')
}

function prepareGrid(files) {
  const boxed = boxStyleIndexes(mustDecode(files, 'xl/styles.xml'))
  const shared = files.get('xl/sharedStrings.xml')
  const strings = stringNodes(shared ? new TextDecoder().decode(shared) : '')
  let best = null
  for (const path of worksheetPaths(files)) {
    const doc = parseXml(mustDecode(files, path))
    const desks = gridDesks(doc, boxed, strings)
    if (!best || desks.length > best.desks.length) best = { path, doc, desks }
  }
  if (!best) throw new Error('This Excel file could not be read.')
  return best
}

function gapSeparator(value) {
  const tokens = tokenize(value)
  if (tokens.length < 2) return null
  return value.slice(tokens[0].end, tokens[1].start)
}

function commonSeparator(desks) {
  const counts = new Map()
  for (const desk of desks) {
    const gap = gapSeparator(desk.text)
    if (gap == null) continue
    counts.set(gap, (counts.get(gap) || 0) + 1)
  }
  let best = '\n'
  let bestCount = -1
  for (const [gap, count] of counts) {
    if (count > bestCount) {
      best = gap
      bestCount = count
    }
  }
  return best
}

function rPrFor(desk, token) {
  if (!desk.runs.length) return null
  const run = desk.runs.find(item => token && token.start >= item.start && token.start < item.end) || desk.runs[desk.runs.length - 1]
  return run?.rPr ? cloneNode(run.rPr) : null
}

function fieldParts(desk, student, pattern, fallback) {
  const tokens = tokenize(desk.text)
  const parts = []
  for (const field of pattern) {
    const value = fieldValue(student, field)
    if (!value) continue
    parts.push({ value, rPr: rPrFor(desk, tokens.find(item => item.type === field)) })
  }
  return { parts, separator: gapSeparator(desk.text) || fallback }
}

function sheetNode(local, attrs, children) {
  return { type: 'element', name: local, local, ns: SHEET_NS, attrs, children, nsMap: {} }
}

function textNode(value) {
  const attrs = []
  if (/^\s|\s$|\s{2}|\n/.test(value)) {
    attrs.push({ name: 'xml:space', local: 'space', ns: 'http://www.w3.org/XML/1998/namespace', value: 'preserve' })
  }
  return sheetNode('t', attrs, [{ type: 'text', text: value }])
}

function writeDeskText(cell, parts, separator) {
  const kept = cell.children.filter(child => child.type !== 'element' || !['v', 'is', 'f'].includes(child.local))
  if (!parts.length) {
    cell.attrs = cell.attrs.filter(attr => attr.local !== 't')
    cell.children = kept
    return
  }
  const type = cell.attrs.find(attr => attr.local === 't')
  if (type) type.value = 'inlineStr'
  else cell.attrs.push({ name: 't', local: 't', ns: '', value: 'inlineStr' })
  const rich = parts.some(part => part.rPr)
  const inline = rich
    ? parts.map((part, index) => {
      const children = []
      if (part.rPr) children.push(part.rPr)
      children.push(textNode(index === 0 ? part.value : separator + part.value))
      return sheetNode('r', [], children)
    })
    : [textNode(parts.map(part => part.value).join(separator))]
  cell.children = [...kept.filter(child => child.type === 'element'), sheetNode('is', [], inline)]
}

function applySeats(prepared, options) {
  const desks = prepared.desks
  const expected = options.rows * options.cols
  if (desks.length !== expected) {
    return {
      ok: false,
      error: `This Excel file has ${desks.length} desk cells, and the page is set to ${options.rows} rows by ${options.cols} columns (${expected} seats).`
    }
  }
  const missing = []
  for (const row of options.seats) {
    for (const no of row) if (no != null && !options.students.has(no)) missing.push(no)
  }
  if (missing.length === 1) return { ok: false, error: `No. ${missing[0]} is missing from the class list.` }
  if (missing.length > 1) return { ok: false, error: `No. ${missing.join(', No. ')} are missing from the class list.` }
  const pattern = choosePattern(desks.map(desk => tokenize(desk.text).map(token => token.type)).filter(sequence => sequence.length > 0))
  const occupied = options.seats.some(row => row.some(no => no != null))
  if (occupied && pattern.length === 0) {
    return { ok: false, error: 'This Excel file has no student text in its desk cells, so the fields cannot be copied.' }
  }
  const fallback = commonSeparator(desks)
  options.seats.forEach((row, rowIndex) => {
    row.forEach((no, colIndex) => {
      const desk = desks[rowIndex * options.cols + colIndex]
      if (no == null) writeDeskText(desk.cell, [], fallback)
      else {
        const written = fieldParts(desk, options.students.get(no), pattern, fallback)
        writeDeskText(desk.cell, written.parts, written.separator)
      }
    })
  })
  return { ok: true, xml: serializeXml(prepared.doc) }
}

function mostCommonFace(counts) {
  let best = ''
  let seen = 0
  for (const [key, count] of counts) {
    if (count > seen) {
      best = key
      seen = count
    }
  }
  return best
}

function styleFaces(stylesXml) {
  const doc = parseXml(stylesXml)
  const fonts = directKids(directKids(doc.root, 'fonts')[0], 'font').map(font => {
    const name = sheetAttr(directKids(font, 'name')[0], 'val') || ''
    const pt = Number(sheetAttr(directKids(font, 'sz')[0], 'val'))
    return { name, pt: Number.isFinite(pt) ? pt : 0 }
  })
  const ids = directKids(directKids(doc.root, 'cellXfs')[0], 'xf').map(xf => Number(sheetAttr(xf, 'fontId') || 0))
  return { fonts, ids }
}

function excelRunFace(rPr) {
  if (!rPr) return { name: '', pt: 0 }
  const name = sheetAttr(directKids(rPr, 'rFont')[0], 'val') || ''
  const pt = Number(sheetAttr(directKids(rPr, 'sz')[0], 'val'))
  return { name, pt: Number.isFinite(pt) ? pt : 0 }
}

async function excelTypeface(buffer) {
  const files = await unzip(buffer)
  const styles = styleFaces(mustDecode(files, 'xl/styles.xml'))
  const names = { cjk: new Map(), latin: new Map() }
  const sizes = { cjk: new Map(), latin: new Map() }
  for (const desk of prepareGrid(files).desks) {
    const styleIndex = Number(sheetAttr(desk.cell, 's') || 0)
    const cellFace = styles.fonts[styles.ids[styleIndex]] || styles.fonts[0] || { name: '', pt: 0 }
    for (const token of tokenize(desk.text)) {
      const script = token.type === 'chiName' ? 'cjk' : 'latin'
      let face = cellFace
      if (desk.runs.length) {
        const run = desk.runs.find(item => token.start >= item.start && token.start < item.end)
        const rich = excelRunFace(run && run.rPr)
        face = { name: rich.name || cellFace.name, pt: rich.pt || cellFace.pt }
      }
      if (face.name) names[script].set(face.name, (names[script].get(face.name) || 0) + 1)
      if (face.pt) sizes[script].set(String(face.pt), (sizes[script].get(String(face.pt)) || 0) + 1)
    }
  }
  return {
    cjk: mostCommonFace(names.cjk),
    latin: mostCommonFace(names.latin),
    cjkPt: Number(mostCommonFace(sizes.cjk)) || 0,
    latinPt: Number(mostCommonFace(sizes.latin)) || 0
  }
}

async function countExcelDesks(buffer) {
  const files = await unzip(buffer)
  return prepareGrid(files).desks.length
}

async function fillExcelTemplate(buffer, options) {
  let prepared
  try {
    prepared = prepareGrid(await unzip(buffer))
  } catch {
    return { ok: false, error: 'This Excel file could not be read.' }
  }
  const result = applySeats(prepared, options)
  if (!result.ok) return result
  return {
    ok: true,
    bytes: replaceZipEntry(buffer, prepared.path, new TextEncoder().encode(result.xml))
  }
}
